<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Game</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="glow glow-one"></div>
<div class="glow glow-two"></div>

<div class="app">

    <!-- TOP -->

    <header class="top">

        <div class="logo">
            <div class="logo-circle">$</div>

            <div>
                <div class="logo-title">LUCKY</div>
                <div class="logo-subtitle">GAME</div>
            </div>
        </div>

        <button class="profile-mini" onclick="openProfile()">
            <img id="avatar"
                 src=""
                 alt="">
            <span id="avatar-fallback">👤</span>
        </button>

    </header>


    <!-- BALANCE -->

    <section class="balance-card">

        <div class="balance-top">
            <span>ВАШ БАЛАНС</span>
            <span class="currency">$</span>
        </div>

        <div class="balance" id="balance">
            $0.00
        </div>

        <div class="balance-actions">

            <button onclick="deposit()" class="yellow-button">
                + Пополнить
            </button>

            <button onclick="withdraw()" class="dark-button">
                Вывести
            </button>

        </div>

    </section>


    <!-- USER -->

    <section class="user-card">

        <div class="user-avatar">
            <img id="big-avatar" src="" alt="">
            <span id="big-avatar-fallback">👤</span>
        </div>

        <div class="user-info">

            <div class="hello">
                Добро пожаловать
            </div>

            <div class="user-name" id="username">
                Игрок
            </div>

        </div>

        <button onclick="openProfile()" class="arrow">
            ›
        </button>

    </section>


    <!-- GAMES -->

    <div class="section-header">

        <h2>Игры</h2>

        <button onclick="openAllGames()">
            Все игры
            <span>›</span>
        </button>

    </div>


    <section class="games">

        <button class="game-card mines"
                onclick="openGame('mines')">

            <div class="game-decoration">✦</div>

            <div class="game-icon">
                💣
            </div>

            <div class="game-title">
                MINES
            </div>

            <div class="game-subtitle">
                Найди безопасные клетки
            </div>

            <div class="play">
                ИГРАТЬ
            </div>

        </button>


        <button class="game-card tower"
                onclick="openGame('tower')">

            <div class="game-decoration">✦</div>

            <div class="game-icon">
                🏰
            </div>

            <div class="game-title">
                TOWER
            </div>

            <div class="game-subtitle">
                Поднимайся выше
            </div>

            <div class="play">
                ИГРАТЬ
            </div>

        </button>


        <button class="game-card crash"
                onclick="openGame('crash')">

            <div class="game-decoration">✦</div>

            <div class="game-icon">
                🚀
            </div>

            <div class="game-title">
                CRASH
            </div>

            <div class="game-subtitle">
                Забери вовремя
            </div>

            <div class="play">
                ИГРАТЬ
            </div>

        </button>

    </section>


    <!-- BONUS -->

    <section class="bonus-card">

        <div>

            <div class="bonus-small">
                БОНУС
            </div>

            <div class="bonus-title">
                Получи награду
            </div>

            <div class="bonus-text">
                Заходи каждый день
            </div>

        </div>

        <button onclick="openBonus()">
            🎁
        </button>

    </section>


    <!-- BOTTOM -->

    <nav class="bottom-nav">

        <button class="active" onclick="goHome()">
            <span>🎮</span>
            <small>Играть</small>
        </button>

        <button onclick="openFinance()">
            <span>💵</span>
            <small>Финансы</small>
        </button>

        <button onclick="openCases()">
            <span>🎁</span>
            <small>Бонусы</small>
        </button>

        <button onclick="openTasks()">
            <span>🎯</span>
            <small>Задания</small>
        </button>

        <button onclick="openProfile()">
            <span>👤</span>
            <small>Профиль</small>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
