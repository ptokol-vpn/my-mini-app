<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0d0d0f">

    <title>Game</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <!-- ========================= -->

    <header class="top">

        <div class="profile">

            <div class="avatar" id="avatar">
                👤
            </div>

            <div class="profile-info">

                <div class="username" id="username">
                    Игрок
                </div>

                <div class="level">
                    Уровень 1
                </div>

                <div class="level-line">
                    <div></div>
                </div>

            </div>

        </div>


        <!-- Баланс -->

        <div class="balance">

            <span id="balance">
                0.00 $
            </span>

            <button onclick="deposit()">
                +
            </button>

        </div>

    </header>



    <!-- ========================= -->
    <!-- ГЛАВНЫЙ БАННЕР -->
    <!-- ========================= -->

    <section class="hero">

        <div class="hero-bg-glow"></div>

        <div class="hero-content">

            <div class="hero-small">
                ДОБРО ПОЖАЛОВАТЬ
            </div>

            <h1>
                Играй и<br>
                <span>зарабатывай!</span>
            </h1>

            <p>
                Больше игр —<br>
                больше наград
            </p>

            <button class="bonus-button"
                    onclick="openBonus()">

                🎁
                <span>Ежедневный бонус</span>

            </button>

        </div>


        <div class="money-orb">
            $
        </div>

    </section>



    <!-- ========================= -->
    <!-- БЫСТРЫЕ ДЕЙСТВИЯ -->
    <!-- ========================= -->

    <section class="quick-actions">


        <button onclick="deposit()">

            <div class="action-icon">
                💰
            </div>

            <b>
                Пополнить
            </b>

            <small>
                Баланс
            </small>

        </button>



        <button onclick="withdraw()">

            <div class="action-icon">
                💸
            </div>

            <b>
                Вывести
            </b>

            <small>
                Средства
            </small>

        </button>



        <button onclick="openVip()">

            <div class="action-icon">
                👑
            </div>

            <b>
                VIP
            </b>

            <small>
                Статус
            </small>

        </button>



        <button onclick="openTasks()">

            <div class="action-icon">
                📋
            </div>

            <b>
                Задания
            </b>

            <small>
                Награды
            </small>

        </button>


    </section>



    <!-- ========================= -->
    <!-- ИГРЫ -->
    <!-- ========================= -->

    <section class="games-section">


        <div class="section-title">

            <h2>
                Игры
            </h2>

        </div>



        <div class="games">


            <!-- КУБ -->

            <button class="game game-cube"
                    onclick="openGame('cube')">

                <div class="game-glow"></div>

                <div class="game-icon">
                    🎲
                </div>

                <div class="game-info">
