<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Game</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Верхняя панель -->

    <header class="top">

        <div class="profile">

            <div class="avatar" id="avatar">
                👤
            </div>

            <div class="profile-info">

                <div class="username" id="username">
                    Игрок
                </div>

                <div class="level">
                    Уровень 1
                </div>

                <div class="level-line">
                    <div></div>
                </div>

            </div>

        </div>


        <div class="balance">

            <span id="balance">
                0.00 $
            </span>

            <button onclick="deposit()">+</button>

        </div>

    </header>


    <!-- Большой баннер -->

    <section class="hero">

        <div class="hero-content">

            <div class="hero-small">
                ДОБРО ПОЖАЛОВАТЬ
            </div>

            <h1>
                Играй и<br>
                <span>зарабатывай!</span>
            </h1>

            <p>
                Больше игр —<br>
                больше наград
            </p>

            <button class="bonus-button"
                    onclick="openBonus()">
                🎁 Ежедневный бонус
            </button>

        </div>

        <div class="money-orb">
            $
        </div>

    </section>


    <!-- Быстрые действия -->

    <section class="quick-actions">

        <button onclick="deposit()">

            <div class="action-icon">
                +
            </div>

            <b>Пополнить</b>
            <small>Баланс</small>

        </button>


        <button onclick="withdraw()">

            <div class="action-icon">
                ↑
            </div>

            <b>Вывести</b>
            <small>Средства</small>

        </button>


        <button onclick="openVip()">

            <div class="action-icon">
                ♛
            </div>

            <b>VIP</b>
            <small>Статус</small>

        </button>


        <button onclick="openTasks()">

            <div class="action-icon">
                ✓
            </div>

            <b>Задания</b>
            <small>Награды</small>

        </button>

    </section>


    <!-- Игры -->

    <section class="games-section">

        <div class="section-title">

            <h2>
                Игры
            </h2>

            <button onclick="openAllGames()">
                Все игры →
            </button>

        </div>


        <div class="games">

            <button class="game"
                    onclick="openGame('cube')">

                <div class="game-image cube">
                    🎲
                </div>

                <b>Куб</b>

                <small>
                    Испытай удачу
                </small>

            </button>


            <button class="game"
                    onclick="openGame('mines')">

                <div class="game-image mines">
                    💣
                </div>

                <b>Мины</b>

                <small>
                    Найди безопасные клетки
                </small>

            </button>


            <button class="game"
                    onclick="openGame('wheel')">

                <div class="game-image wheel">
                    🎡
                </div>

                <b>Колесо</b>

                <small>
                    Крути и выигрывай
                </small>

            </button>


            <button class="game"
                    onclick="openGame('crash')">

                <div class="game-image crash">
                    🚀
                </div>

                <b>Краш</b>

                <small>
                    Забери вовремя
                </small>

            </button>

        </div>

    </section>


    <!-- Нижняя навигация -->

    <nav class="bottom-nav">

        <button class="active"
                onclick="goHome()">

            <span>⌂</span>
            <small>Главная</small>

        </button>


        <button onclick="openAllGames()">

            <span>🎮</span>
            <small>Игры</small>

        </button>


        <button onclick="openBalance()">

            <span>▣</span>
            <small>Баланс</small>

        </button>


        <button onclick="openBonus()">

            <span>🎁</span>
            <small>Бонусы</small>

        </button>


        <button onclick="openProfile()">

            <span>●</span>
            <small>Профиль</small>

        </button>

    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
