<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#090909">

<title>WXS Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style.css">

</head><body><div class="app"><!-- =========================================
     ГЛАВНАЯ
========================================== -->

<main id="homePage" class="page active">

    <!-- ВЕРХНИЙ ПРОФИЛЬ -->

    <header class="top">

        <div class="profile-card">

            <div class="avatar-frame">
                <div class="avatar" id="topAvatar">
                    👤
                </div>
            </div>

            <div class="profile-info">

                <div class="username" id="topUsername">
                    Игрок
                </div>

                <div class="level">
                    Уровень 1
                </div>

                <div class="level-line">
                    <div></div>
                </div>

            </div>

        </div>


        <!-- БАЛАНС -->

        <div class="balance">

            <div class="balance-info">

                <small>Баланс</small>

                <span id="balance">
                    0.00 $
                </span>

            </div>

            <button
                class="balance-add"
                onclick="deposit()">
                +
            </button>

        </div>

    </header>


    <!-- БАННЕР -->

    <section class="hero">

        <div class="hero-content">

            <div class="hero-small">
                ДОБРО ПОЖАЛОВАТЬ
            </div>

            <h1>
                Играй и<br>
                <span>зарабатывай!</span>
            </h1>

            <p>
                Больше игр —<br>
                больше наград
            </p>

            <button
                class="bonus-button"
                onclick="openBonus()">

                <span>🎁</span>
                Ежедневный бонус

            </button>

        </div>

        <div class="money-orb">

            <div class="money-ring"></div>

            <span>$</span>

        </div>

    </section>


    <!-- БЫСТРЫЕ ДЕЙСТВИЯ -->

    <section class="quick-actions">

        <button class="action" onclick="deposit()">
            <div class="action-icon">💰</div>
            <b>Пополнить</b>
            <small>Баланс</small>
        </button>

        <button class="action" onclick="withdraw()">
            <div class="action-icon">💸</div>
            <b>Вывести</b>
            <small>Средства</small>
        </button>

        <button class="action" onclick="openVip()">
            <div class="action-icon">👑</div>
            <b>VIP</b>
            <small>Статус</small>
        </button>

        <button class="action" onclick="openTasks()">
            <div class="action-icon">📋</div>
            <b>Задания</b>
            <small>Награды</small>
        </button>

    </section>


    <!-- ИГРЫ -->

    <section class="games-section">

        <div class="section-title">
            <h2>Игры</h2>
        </div>

        <div class="games">

            <button
                class="game"
                onclick="openGame('cube')">

                <div class="game-image cube">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        🎲
                    </span>

                </div>

                <div class="game-name">
                    Куб
                </div>

                <div class="game-description">
                    Испытай удачу
                </div>

            </button>


            <button
                class="game"
                onclick="openGame('mines')">

                <div class="game-image mines">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        💣
                    </span>

                </div>

                <div class="game-name">
                    Мины
                </div>

                <div class="game-description">
                    Найди безопасные клетки
                </div>

            </button>


            <button
                class="game"
                onclick="openGame('wheel')">

                <div class="game-image wheel">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        🎡
                    </span>

                </div>

                <div class="game-name">
                    Колесо
                </div>

                <div class="game-description">
                    Крути и выигрывай
                </div>

            </button>


            <button
                class="game"
                onclick="openGame('crash')">

                <div class="game-image crash">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        🚀
                    </span>

                </div>

                <div class="game-name">
                    Краш
                </div>

                <div class="game-description">
                    Забери вовремя
                </div>

            </button>

        </div>

    </section>

</main>


<!-- =========================================
     ПРОФИЛЬ
========================================== -->

<main id="profilePage" class="page profile-page">

    <div class="profile-header">

        <div class="profile-avatar-frame">

            <div class="profile-avatar" id="profileAvatar">
                👤
            </div>

        </div>

        <h1 id="profileName">
            Игрок
        </h1>

        <div class="profile-username" id="profileUsername">
            @username
        </div>

        <div class="profile-level">
            Уровень 1
        </div>

    </div>


    <!-- СТАТИСТИКА -->

    <section class="stats-section">

        <div class="stats-grid">

            <div class="stat-card">

                <span>
                    Оборот
                </span>

                <strong id="turnover">
                    0.00 $
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Макс. коэффициент
                </span>

                <strong id="maxCoefficient">
                    0.00x
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Общий выигрыш
                </span>

                <strong id="totalWin">
                    0.00 $
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Кол-во ставок
                </span>

                <strong id="betsCount">
                    0
                </strong>

            </div>

        </div>

    </section>


    <!-- ДОПОЛНИТЕЛЬНАЯ КАРТОЧКА -->

    <section class="profile-info-card">

        <div class="profile-info-row">

            <span>Статус</span>

            <b>
                Обычный игрок
            </b>

        </div>

        <div class="profile-info-row">

            <span>Баланс</span>

            <b id="profileBalance">
                0.00 $
            </b>

        </div>

    </section>

</main>


<!-- =========================================
     НИЖНЕЕ МЕНЮ
========================================== -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        id="navHome"
        onclick="showPage('home')">

        <span class="nav-icon">
            🏠
        </span>

        <small>
            Главная
        </small>

    </button>


    <button
        class="nav-item"
        id="navGames"
        onclick="openAllGames()">

        <span class="nav-icon">
            🎮
        </span>

        <small>
            Игры
        </small>

    </button>


    <button
        class="nav-item"
        id="navBalance"
        onclick="openBalance()">

        <span class="nav-icon">
            💰
        </span>

        <small>
            Баланс
        </small>

    </button>


    <button
        class="nav-item"
        id="navBonus"
        onclick="openBonus()">

        <span class="nav-icon">
            🎁
        </span>

        <small>
            Бонусы
        </small>

    </button>


    <button
        class="nav-item"
        id="navProfile"
        onclick="showPage('profile')">

        <span class="nav-icon">
            👤
        </span>

        <small>
            Профиль
        </small>

    </button>

</nav>

</div><script>

const tg = window.Telegram?.WebApp;

if (tg) {

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {

        const firstName =
            user.first_name ||
            user.username ||
            "Игрок";

        const username =
            user.username
                ? "@" + user.username
                : "Telegram";


        /* Верхний профиль */

        document.getElementById(
            "topUsername"
        ).textContent = firstName;


        /* Большой профиль */

        document.getElementById(
            "profileName"
        ).textContent = firstName;


        document.getElementById(
            "profileUsername"
        ).textContent = username;


        /* Аватар */

        if (user.photo_url) {

            const avatarHTML = `
                <img
                    src="${user.photo_url}"
                    alt="avatar">
            `;

            document.getElementById(
                "topAvatar"
            ).innerHTML = avatarHTML;

            document.getElementById(
                "profileAvatar"
            ).innerHTML = avatarHTML;

        }

    }

}


/* =========================================
   ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
========================================= */

function showPage(page) {

    const home =
        document.getElementById("homePage");

    const profile =
        document.getElementById("profilePage");


    home.classList.remove("active");
    profile.classList.remove("active");


    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.remove("active");

        });


    if (page === "profile") {

        profile.classList.add("active");

        document
            .getElementById("navProfile")
            .classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        home.classList.add("active");

        document
            .getElementById("navHome")
            .classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


/* =========================================
   ВРЕМЕННЫЕ КНОПКИ
========================================= */

function deposit() {
    alert("Пополнение баланса");
}

function withdraw() {
    alert("Вывод средств");
}

function openVip() {
    alert("VIP");
}

function openTasks() {
    alert("Задания");
}

function openBonus() {
    alert("Ежедневный бонус");
}

function openGame(game) {
    alert("Игра: " + game);
}

function openAllGames() {

    document
        .getElementById("navGames")
        .classList.add("active");

    alert("Раздел игр");

}

function openBalance() {

    document
        .getElementById("navBalance")
        .classList.add("active");

    alert("Баланс");

}

</script><script src="script.js"></script></body>
</html>
