<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#090909">

    <title>WXS Game</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ==================== ГЛАВНАЯ ==================== -->

    <main id="homePage">

        <header class="top">

            <div class="profile-card"
                 onclick="openProfile()">

                <div class="avatar-frame">
                    <div class="avatar" id="avatar">👤</div>
                </div>

                <div class="profile-info">

                    <div class="username"
                         id="username">
                        Игрок
                    </div>

                    <div class="level">
                        Уровень 1
                    </div>

                    <div class="level-line">
                        <div></div>
                    </div>

                </div>

            </div>

            <div class="balance">

                <div class="balance-info">
                    <small>Баланс</small>

                    <span id="topBalance">
                        125.50 $
                    </span>
                </div>

                <button class="balance-add"
                        onclick="openBalance('deposit')">
                    +
                </button>

            </div>

        </header>


        <section class="hero">

            <div class="hero-content">

                <div class="hero-small">
                    ДОБРО ПОЖАЛОВАТЬ
                </div>

                <h1>
                    Играй и<br>
                    <span>развлекайся!</span>
                </h1>

                <p>
                    Больше игр —<br>
                    больше наград
                </p>

                <button class="bonus-button"
                        onclick="openBonus()">

                    <span>🎁</span>
                    Ежедневный бонус

                </button>

            </div>

            <div class="money-orb">
                <div class="money-ring"></div>
                <span>$</span>
            </div>

        </section>


        <section class="quick-actions">

            <button class="action"
                    onclick="openBalance('deposit')">

                <div class="action-icon">💰</div>
                <b>Пополнить</b>
                <small>Баланс</small>

            </button>


            <button class="action"
                    onclick="openBalance('withdraw')">

                <div class="action-icon">💸</div>
                <b>Вывести</b>
                <small>Средства</small>

            </button>


            <button class="action"
                    onclick="showMessage('VIP пока в разработке')">

                <div class="action-icon">👑</div>
                <b>VIP</b>
                <small>Статус</small>

            </button>


            <button class="action"
                    onclick="showMessage('Задания пока в разработке')">

                <div class="action-icon">📋</div>
                <b>Задания</b>
                <small>Награды</small>

            </button>

        </section>


        <!-- ИГРЫ -->

        <section class="games-section">

            <div class="section-title">
                <h2>Игры</h2>
            </div>

            <div class="games">

                <button class="game"
                        onclick="showMessage('Игра «Куб» пока в разработке')">

                    <div class="game-image">

                        <div class="game-glow"></div>

                        <span class="game-emoji">🎲</span>

                    </div>

                    <div class="game-name">
                        Куб
                    </div>

                    <div class="game-description">
                        Испытай удачу
                    </div>

                </button>


                <button class="game"
                        onclick="showMessage('Игра «Мины» пока в разработке')">

                    <div class="game-image mines">

                        <div class="game-glow"></div>

                        <span class="game-emoji">💣</span>

                    </div>

                    <div class="game-name">
                        Мины
                    </div>

                    <div class="game-description">
                        Найди безопасные клетки
                    </div>

                </button>


                <button class="game"
                        onclick="openWheel()">

                    <div class="game-image wheel">

                        <div class="game-glow"></div>

                        <span class="game-emoji">🎡</span>

                    </div>

                    <div class="game-name">
                        Колесо
                    </div>

                    <div class="game-description">
                        Крути и получай награду
                    </div>

                </button>


                <button class="game"
                        onclick="showMessage('Игра «Краш» пока в разработке')">

                    <div class="game-image crash">

                        <div class="game-glow"></div>

                        <span class="game-emoji">🚀</span>

                    </div>

                    <div class="game-name">
                        Краш
                    </div>

                    <div class="game-description">
                        Забери вовремя
                    </div>

                </button>

            </div>

        </section>

    </main>


    <!-- ==================== КОЛЕСО ==================== -->

    <main id="wheelPage"
          class="wheel-page hidden">

        <div class="page-header">

            <button class="back-button"
                    aria-label="Назад"
                    onclick="goHome()">
            </button>

            <h1>Колесо</h1>

            <div class="header-space"></div>

        </div>


        <section class="wheel-card">

            <div class="wheel-label">
                КОЛЕСО НАГРАД
            </div>

            <h2>
                Крути колесо
            </h2>

            <p class="wheel-subtitle">
                Испытай удачу и получи случайную награду
            </p>


            <!-- ОБЛАСТЬ КОЛЕСА -->

            <div class="wheel-stage">

                <!-- НЕПОДВИЖНАЯ СТРЕЛКА -->

                <div class="wheel-pointer">

                    <div class="pointer-tip"></div>

                </div>


                <!-- САМО КОЛЕСО -->

                <div class="wheel-outer">

                    <div class="wheel-ring"></div>

                    <div class="wheel"
                         id="wheel">

                        <div class="wheel-center">
                            <span>WXS</span>
                        </div>

                    </div>

                </div>

            </div>


            <!-- РЕЗУЛЬТАТ -->

            <div class="wheel-result"
                 id="wheelResult">

                <span class="result-small">
                    РЕЗУЛЬТАТ
                </span>

                <strong id="resultValue">
                    ?
                </strong>

            </div>


            <!-- КНОПКА -->

            <button class="spin-button"
                    id="spinButton"
                    onclick="spinWheel()">

                <span class="spin-icon">↻</span>

                Крутить колесо

            </button>


            <div class="spin-hint">
                Нажми кнопку, чтобы запустить вращение
            </div>

        </section>


        <!-- СПИСОК НАГРАД -->

        <section class="wheel-rewards">

            <div class="section-title">
                <h2>Сектора</h2>
            </div>

            <div class="reward-list">

                <div class="reward-item">
                    <span>⭐
