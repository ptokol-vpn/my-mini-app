<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#111111">

    <title>WXS Game</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         ПРОФИЛЬ
    ========================== -->

    <header class="top">

        <div class="profile-card">

            <div class="avatar-frame">

                <div class="avatar" id="avatar">
                    👤
                </div>

            </div>

            <div class="profile-info">

                <div class="username" id="username">
                    Игрок
                </div>

                <div class="level">
                    Уровень 1
                </div>

                <div class="level-line">
                    <div></div>
                </div>

            </div>

        </div>


        <!-- Баланс -->

        <div class="balance">

            <div class="balance-info">

                <small>Баланс</small>

                <span id="balance">
                    0.00 $
                </span>

            </div>

            <button
                class="balance-add"
                onclick="deposit()">
                +
            </button>

        </div>

    </header>


    <!-- =========================
         БАННЕР
    ========================== -->

    <section class="hero">

        <div class="hero-glow"></div>

        <div class="hero-content">

            <div class="hero-small">
                ДОБРО ПОЖАЛОВАТЬ
            </div>

            <h1>
                Играй и<br>
                <span>зарабатывай!</span>
            </h1>

            <p>
                Больше игр —<br>
                больше наград
            </p>

            <button
                class="bonus-button"
                onclick="openBonus()">

                <span>🎁</span>
                Ежедневный бонус

            </button>

        </div>

        <div class="money-orb">

            <div class="money-ring"></div>

            <span>$</span>

        </div>

    </section>


    <!-- =========================
         БЫСТРЫЕ ДЕЙСТВИЯ
    ========================== -->

    <section class="quick-actions">


        <button
            class="action"
            onclick="deposit()">

            <div class="action-icon">
                💰
            </div>

            <b>Пополнить</b>

            <small>
                Баланс
            </small>

        </button>


        <button
            class="action"
            onclick="withdraw()">

            <div class="action-icon">
                💸
            </div>

            <b>Вывести</b>

            <small>
                Средства
            </small>

        </button>


        <button
            class="action"
            onclick="openVip()">

            <div class="action-icon">
                👑
            </div>

            <b>VIP</b>

            <small>
                Статус
            </small>

        </button>


        <button
            class="action"
            onclick="openTasks()">

            <div class="action-icon">
                📋
            </div>

            <b>Задания</b>

            <small>
                Награды
            </small>

        </button>

    </section>


    <!-- =========================
         ИГРЫ
    ========================== -->

    <section class="games-section">

        <div class="section-title">

            <h2>
                Игры
            </h2>

        </div>


        <div class="games">


            <!-- КУБ -->

            <button
                class="game"
                onclick="openGame('cube')">

                <div class="game-image cube">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        🎲
                    </span>

                </div>

                <div class="game-name">
                    Куб
                </div>

                <div class="game-description">
                    Испытай удачу
                </div>

            </button>


            <!-- МИНЫ -->

            <button
                class="game"
                onclick="openGame('mines')">

                <div class="game-image mines">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        💣
                    </span>

                </div>

                <div class="game-name">
                    Мины
                </div>

                <div class="game-description">
                    Найди безопасные клетки
                </div>

            </button>


            <!-- КОЛЕСО -->

            <button
                class="game"
                onclick="openGame('wheel')">

                <div class="game-image wheel">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        🎡
                    </span>

                </div>

                <div class="game-name">
                    Колесо
                </div>

                <div class="game-description">
                    Крути и выигрывай
                </div>

            </button>


            <!-- КРАШ -->

            <button
                class="game"
                onclick="openGame('crash')">

                <div class="game-image crash">

                    <div class="game-glow"></div>

                    <span class="game-emoji">
                        🚀
                    </span>

                </div>

                <div class="game-name">
                    Краш
                </div>

                <div class="game-description">
                    Забери вовремя
                </div>

            </button>

        </div>

    </section>


    <!-- =========================
         НИЖНЕЕ МЕНЮ
    ========================== -->

    <nav class="bottom-nav">


        <button
            class="nav-item active"
            onclick="goHome()">

            <span class="nav-icon">
                🏠
            </span>

            <small>
                Главная
            </small>

        </button>


        <button
            class="nav-item"
            onclick="openAllGames()">

            <span class="nav-icon">
                🎮
            </span>

            <small>
                Игры
            </small>

        </button>


        <button
            class="nav-item"
            onclick="openBalance()">

            <span class="nav-icon">
                💰
            </span>

            <small>
                Баланс
            </small>

        </button>


        <button
            class="nav-item"
            onclick="openBonus()">

            <span class="nav-icon">
                🎁
            </span>

            <small>
                Бонусы
            </small>

        </button>


        <button
            class="nav-item"
            onclick="openProfile()">

            <span class="nav-icon">
                👤
            </span>

            <small>
                Профиль
            </small>

        </button>

    </nav>

</div>


<!-- =========================
     TELEGRAM
========================== -->

<script>

const tg = window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    tg.expand();

    const user =
        tg.initDataUnsafe?.user;

    if (user) {

        const username =
            document.getElementById("username");

        const avatar =
            document.getElementById("avatar");


        username.textContent =
            user.first_name ||
            user.username ||
            "Игрок";


        if (user.photo_url) {

            avatar.innerHTML = `
                <img
                    src="${user.photo_url}"
                    alt="avatar">
            `;

        }

    }

}

</script>


<!-- Твой JS -->
<script src="script.js"></script>

</body>
</html>
